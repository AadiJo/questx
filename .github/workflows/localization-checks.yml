name: Localization checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'protos/**'
      - 'questx-lib/**'
      - 'tests/measurement-checks/**'
      - 'tests/frame-worker/**'
      - 'tests/poselib-packing-checks/**'
      - 'tests/apriltag-preview/**'
      - 'tests/native-localization/**'
      - 'tests/napa-detector/**'
      - 'native/napa/**'
      - 'unity/Assets/Plugins/napa/**'
      - 'unity/Assets/QuestX/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'protos/**'
      - 'questx-lib/**'
      - 'tests/measurement-checks/**'
      - 'tests/frame-worker/**'
      - 'tests/poselib-packing-checks/**'
      - 'tests/apriltag-preview/**'
      - 'tests/native-localization/**'
      - 'tests/napa-detector/**'
      - 'native/napa/**'
      - 'unity/Assets/Plugins/napa/**'
      - 'unity/Assets/QuestX/**'

permissions:
  contents: read

concurrency:
  group: localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-proto-csharp:
    uses: ./.github/workflows/reusable-build-proto-csharp.yml

  build-proto-java:
    uses: ./.github/workflows/reusable-build-proto-java.yml

  measurement-roundtrip:
    name: C# to Java measurement checks
    needs: [build-proto-csharp, build-proto-java]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            questx-lib
            tests/measurement-checks
            tests/frame-worker
            tests/poselib-packing-checks
            tests/apriltag-preview
            unity/Assets/QuestX

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - uses: actions/download-artifact@v5
        with:
          pattern: questx-proto-csharp-*
          merge-multiple: true
          path: unity/Assets/QuestX/Generated

      - uses: actions/download-artifact@v5
        with:
          pattern: questx-proto-java-*
          merge-multiple: true
          path: questx-lib/src/main/java/gg/questx/questx/protos/generated

      - name: Check covariance and regenerate wire fixtures with the C# encoder
        run: dotnet run --configuration Release --project tests/measurement-checks/MeasurementChecks.csproj -- --export-fixtures

      - name: Check frame worker, preview handoff, and solver input packing
        run: |
          dotnet run --configuration Release --project tests/frame-worker/FrameWorkerChecks.csproj
          dotnet run --configuration Release --project tests/apriltag-preview/PreviewChecks.csproj
          dotnet run --configuration Release --project tests/poselib-packing-checks/PoseLibPackingChecks.csproj

      - name: Decode freshly generated fixtures and check the WPILib update
        working-directory: questx-lib
        run: gradle spotlessCheck test --no-daemon

  capture-checks:
    name: NT4 capture checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tests/native-localization
            questx-lib/src/test/resources

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned NT4 runtime
        run: python -m pip install pyntcore==2026.2.2

      - name: Check wire validation and capture failure handling
        run: python -m unittest discover -s tests/native-localization -p test_capture_tools.py -v

      - name: Check synthetic NT4 server and client capture
        run: python -m unittest discover -s tests/native-localization -p test_nt_loopback.py -v

  napa-dependency:
    name: Published NAPA dependency and detector checks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: true
          sparse-checkout: |
            native/napa
            tests/napa-detector
            unity/Assets/QuestX
            unity/Assets/Plugins/napa
            unity/Assets/Plugins/apriltag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Check dependency restore integrity and failure handling
        run: python -m unittest discover -s native/napa -p test_restore.py -v

      - name: Restore and verify the published native packages
        run: |
          python native/napa/restore.py
          python native/napa/restore.py --check

      - name: Compare NAPA and AprilTag through the production C# adapters
        if: runner.os == 'Windows'
        run: dotnet run --configuration Release --project tests/napa-detector/NapaDetectorChecks.csproj
